name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Screengrabber.sln

      - name: Build solution
        run: dotnet build Screengrabber.sln -c Release --no-restore

      - name: Run tests with coverage
        run: dotnet test Screengrabber.sln -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: error

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-results
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: TestResults/**/coverage.cobertura.xml
          flags: unittests
          fail_ci_if_error: true
          verbose: true